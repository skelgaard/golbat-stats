version: '3.8'

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: golbat
      MYSQL_USER: golbat
      MYSQL_PASSWORD: golbat
    ports:
      - "3307:3306"
    command: --sql-mode=""
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    image: php:8.2-apache
    ports:
      - "8888:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql && apache2-foreground"
